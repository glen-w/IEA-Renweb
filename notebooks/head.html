    if (applying) return;
    applying = true;
    document.querySelectorAll('link[rel="icon"]').forEach((el) => {
      if (el.dataset.renweb !== "icon") el.remove();
    });
    let icon = document.querySelector('link[data-renweb="icon"]');
    if (!icon) {
      icon = document.createElement("link");
      icon.rel = "icon";
      icon.type = "image/png";
      icon.sizes = "32x32";
      icon.dataset.renweb = "icon";
      document.head.appendChild(icon);
    }
    if (!icon.href.startsWith("data:image/png")) icon.href = renwebIcon;
    let apple = document.querySelector('link[data-renweb="apple"]');
    if (!apple) {
      apple = document.createElement("link");
      apple.rel = "apple-touch-icon";
      apple.dataset.renweb = "apple";
      document.head.appendChild(apple);
    }
    if (!apple.href.startsWith("data:image/png")) apple.href = renwebApple;
    applying = false;
  }
  applyRenwebIcons();
  document.addEventListener("DOMContentLoaded", applyRenwebIcons);
  window.addEventListener("load", applyRenwebIcons);
  new MutationObserver(applyRenwebIcons).observe(document.head, {
    childList: true,
    subtree: true,
    attributes: true,
    attributeFilter: ["href", "rel"],
  });
</script>
