[project]
name = "iea-renweb"
version = "1.0.0"
description = "Tools for turning IEA World Energy Balances into renewable energy statistics."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Glen" }]
requires-python = ">=3.11"
keywords = ["energy", "iea", "renewables", "statistics", "balances"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "duckdb>=1.1.0",
    "pyarrow>=16.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1.0"]
worldbank = ["httpx>=0.27"]
irena = ["httpx>=0.27"]
notebook = ["marimo>=0.9.0", "plotly>=5.24.0", "pandas>=2.2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.11",
]

[project.urls]
Repository = "https://github.com/glen-w/IEA-Renweb"

[project.scripts]
renweb = "renweb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src/renweb/refdata/data ships with the package: the .gitignore `/data/` rule
# is anchored to the repo root. A force-include of the same directory made
# current hatchling refuse to add the files twice.
packages = ["src/renweb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
# Marimo cell structure is not a formatter target.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = '''
/(
    notebooks
)/
'''

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["renweb"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
# Third-party types are not relied on (see the overrides below). numpy, pulled
# in by the notebook extra, ships stubs that use the 3.12 `type` statement and
# per-module overrides do not stop mypy parsing site-packages stubs.
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["duckdb", "duckdb.*", "pyarrow", "pyarrow.*", "rich", "rich.*", "openpyxl", "openpyxl.*", "httpx", "httpx.*", "pandas", "pandas.*", "plotly", "plotly.*", "marimo", "marimo.*"]
ignore_missing_imports = true
